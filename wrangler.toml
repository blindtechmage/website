name = "blindtechmage-website"
compatibility_date = "2026-01-01"
# mimetext (used to build the contact form's outbound MIME message) requires
# the nodejs_compat flag.
compatibility_flags = ["nodejs_compat"]

# Required by @astrojs/cloudflare's built-in sessions feature (auto-injects
# a SESSION KV binding regardless of whether this project uses sessions
# directly). KV namespace IDs are not secret — see
# https://developers.cloudflare.com/kv/concepts/kv-namespaces/.
[[kv_namespaces]]
binding = "SESSION"
id = "cf7dafbef60049ea95d4982cbe2504f9"

# Contact form outbound email, via the classic Email Routing `send_email`
# binding (legacy EmailMessage/mimetext API) rather than the newer Email
# Sending product, which requires a Workers Paid plan this account does not
# have. `destination_address` restricts the binding to a single, already
# account-verified address, so no sending-domain SPF/DKIM onboarding is
# needed. See docs/SECURITY.md.
[[send_email]]
name = "EMAIL"
destination_address = "blindtechmage+jwauthier@gmail.com"

# @astrojs/cloudflare (Workers-targeting, not classic Pages) generates a
# complete, ready-to-deploy wrangler.json at dist/server/wrangler.json on
# every build, merging these top-level settings with the correct `main`
# and `assets` paths for the built output. Do not hand-maintain `main` or
# `[assets]` here — declaring them at this level causes build-time
# resolution failures, since they'd need to point at paths that only
# exist after the build completes.
#
# D1 database bindings are added here once the resource-table schema
# design (docs/PRD.md, Open Items) is finalized. Example shape, not yet active:
#
# [[d1_databases]]
# binding = "DB"
# database_name = "blindtechmage-resources"
# database_id = "REPLACE_WITH_REAL_ID"

# Contact form rate limiting. Requires a real KV namespace, created via
# `wrangler kv namespace create RATE_LIMIT` before this is active — not yet
# provisioned.
#
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "REPLACE_WITH_REAL_ID"

# Contact form secrets (CONTACT_SENDER, CONTACT_RECIPIENT, RECAPTCHA_SECRET)
# are set via `wrangler secret put <NAME>`, never committed here. Neither
# CONTACT_SENDER nor CONTACT_RECIPIENT is sensitive by nature, but they are
# kept as secrets rather than [vars] so they aren't committed to a public
# repo. See docs/SECURITY.md.
#
# The reCAPTCHA site key (PUBLIC_RECAPTCHA_SITE_KEY) is not secret — it is a
# build-time public environment variable, set via a `.env` file locally
# (untracked, see .gitignore) or a repository/environment variable in CI.
